# Example single-stage high-power rocket on a 38 mm H motor, Level 1 style:
# one parachute, deployed by the motor's ejection charge.
# The motor curve is synthetic (see the .eng file header); swap in a real one
# from thrustcurve.org for real predictions.

[rocket]
name = "Example L1 rocket"
cd = 0.45               # constant drag coefficient, or cd_file = "....csv"

# Geometry, used for stability. Positions are metres aft of the nose tip.
# Dry mass and CG are summed from the parts below.

[nose]
shape = "ogive"
length_m = 0.25
mass_kg = 0.12

[body]
length_m = 1.00
diameter_m = 0.066      # 2.6 in body tube
mass_kg = 0.50

[fins]
count = 3
root_chord_m = 0.15
tip_chord_m = 0.06
span_m = 0.065
sweep_m = 0.07
mass_kg = 0.12          # all three fins

[[mass]]
name = "recovery gear"
mass_kg = 0.18
position_m = 0.40

[[mass]]
name = "motor mount and retainer"
mass_kg = 0.18
position_m = 1.12

[motor]
file = "../data/motors/Synthetic_H250.eng"

[environment]
site_elevation_m = 0.0
wind_speed_mps = 4.0    # blowing downrange
temperature_offset_K = 0.0

[rail]
length_m = 1.83         # 6 ft rail
angle_deg = 90.0

[[parachute]]
name = "main"
diameter_m = 0.9        # 36 in round chute
cd = 1.5
deploy = "burnout"      # motor ejection charge
delay_s = 10.0          # motor delay, picked so the chute opens near apogee
