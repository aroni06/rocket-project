# The same airframe flown dual deploy: a small drogue at apogee keeps the descent
# fast and the drift short, then the main opens low for a soft landing.

[rocket]
name = "Example L1 rocket, dual deploy"

# Drag is estimated from the geometry below. The alternatives are a constant
# cd = 0.45 or a cd_file = "....csv" in [rocket].
[drag]
model = "geometry"
roughness_m = 60e-6     # regular paint

# Geometry, used for stability and drag. Positions are metres aft of the nose tip.
# Dry mass and CG are summed from the parts below.

[nose]
shape = "ogive"
length_m = 0.25
mass_kg = 0.12

[body]
length_m = 1.00
diameter_m = 0.066      # 2.6 in body tube
mass_kg = 0.50

[fins]
count = 3
root_chord_m = 0.15
tip_chord_m = 0.06
span_m = 0.065
sweep_m = 0.07
thickness_m = 0.0032    # 1/8 in G10 fiberglass; mass follows the fin size
density_kgm3 = 1830.0
profile = "rounded"     # edge shape: square, rounded or airfoil

[[mass]]
name = "recovery gear"
mass_kg = 0.18
position_m = 0.40

[[mass]]
name = "motor mount and retainer"
mass_kg = 0.18
position_m = 1.12

[[mass]]
name = "altimeter bay"
mass_kg = 0.05
position_m = 0.30

[motor]
file = "../data/motors/Synthetic_H250.eng"

[environment]
wind_speed_mps = 4.0

[rail]
length_m = 1.83
angle_deg = 90.0

[[parachute]]
name = "drogue"
diameter_m = 0.30
cd = 1.5
deploy = "apogee"
delay_s = 1.0           # typical altimeter backup-safe delay

[[parachute]]
name = "main"
diameter_m = 0.9
cd = 1.5
deploy = "altitude"
altitude_m = 150.0
